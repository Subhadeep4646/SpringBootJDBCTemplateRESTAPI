<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 30px;
        color: #222;
    }
    h1 { text-align: center; margin-bottom: 30px; }
    .container {
        max-width: 900px;
        margin: 0 auto;
    }
    .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        padding: 20px;
        margin-bottom: 25px;
    }
    form {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 10px;
        align-items: end;
    }
    label {
        font-size: 13px;
        font-weight: bold;
        display: block;
        margin-bottom: 4px;
    }
    input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        padding: 9px 16px;
        border: none;
        border-radius: 4px;
        background: #2d6cdf;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
    }
    button:hover { background: #1f54b3; }
    button.secondary { background: #6c757d; }
    button.secondary:hover { background: #545b62; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #b02a37; }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #e5e5e5;
        font-size: 14px;
    }
    th { background: #fafafa; }
    tr:hover { background: #f9fbff; }
    .actions button { margin-right: 6px; font-size: 12px; padding: 6px 10px; }
    #status {
        min-height: 20px;
        font-size: 14px;
        margin-top: 10px;
    }
    .status-ok { color: #1a7a30; }
    .status-error { color: #c0392b; }
    .form-title { margin-top: 0; }
    #cancelEditBtn { display: none; }
</style>
</head>
<body>
<div class="container">
    <h1>Employee Management</h1>

    <div class="card">
        <h3 class="form-title" id="formTitle">Add New Employee</h3>
        <form id="employeeForm">
            <input type="hidden" id="employeeId">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>
            <div>
                <label for="department">Department</label>
                <input type="text" id="department" required>
            </div>
            <div>
                <label for="salary">Salary</label>
                <input type="number" step="0.01" id="salary" required>
            </div>
            <div>
                <button type="submit" id="submitBtn">Add Employee</button>
                <button type="button" id="cancelEditBtn" class="secondary">Cancel</button>
            </div>
        </form>
        <div id="status"></div>
    </div>

    <div class="card">
        <h3 style="margin-top:0;">Employees</h3>
        <button type="button" id="refreshBtn" class="secondary" style="margin-bottom:15px;">Refresh List</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = '/api/v1/employee';

    const form = document.getElementById('employeeForm');
    const idField = document.getElementById('employeeId');
    const nameField = document.getElementById('name');
    const departmentField = document.getElementById('department');
    const salaryField = document.getElementById('salary');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const formTitle = document.getElementById('formTitle');
    const statusEl = document.getElementById('status');
    const tableBody = document.getElementById('employeeTableBody');
    const refreshBtn = document.getElementById('refreshBtn');

    function showStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.className = isError ? 'status-error' : 'status-ok';
    }

    function resetForm() {
        form.reset();
        idField.value = '';
        submitBtn.textContent = 'Add Employee';
        formTitle.textContent = 'Add New Employee';
        cancelEditBtn.style.display = 'none';
    }

    async function loadEmployees() {
        try {
            const res = await fetch(API_BASE + '/');
            const body = await res.json();
            if (!res.ok) {
                throw new Error(body.message || 'Failed to load employees');
            }
            renderTable(body.data || []);
        } catch (err) {
            showStatus(err.message, true);
        }
    }

    function renderTable(employees) {
        tableBody.innerHTML = '';
        if (employees.length === 0) {
            const row = document.createElement('tr');
            row.innerHTML = '<td colspan="5" style="text-align:center;color:#888;">No employees found</td>';
            tableBody.appendChild(row);
            return;
        }

        employees.forEach(emp => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${emp.id}</td>
                <td>${escapeHtml(emp.name)}</td>
                <td>${escapeHtml(emp.department)}</td>
                <td>${Number(emp.salary).toFixed(2)}</td>
                <td class="actions">
                    <button type="button" class="secondary edit-btn" data-id="${emp.id}">Edit</button>
                    <button type="button" class="danger delete-btn" data-id="${emp.id}">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });

        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => startEdit(btn.dataset.id, employees));
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteEmployee(btn.dataset.id));
        });
    }

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value ?? '';
        return div.innerHTML;
    }

    function startEdit(id, employees) {
        const emp = employees.find(e => String(e.id) === String(id));
        if (!emp) return;
        idField.value = emp.id;
        nameField.value = emp.name;
        departmentField.value = emp.department;
        salaryField.value = emp.salary;
        submitBtn.textContent = 'Update Employee';
        formTitle.textContent = 'Edit Employee #' + emp.id;
        cancelEditBtn.style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteEmployee(id) {
        if (!confirm('Delete employee #' + id + '?')) return;
        try {
            const res = await fetch(API_BASE + '/' + id, { method: 'DELETE' });
            const body = await res.json();
            if (!res.ok) {
                throw new Error(body.message || 'Failed to delete employee');
            }
            showStatus(body.message, false);
            loadEmployees();
        } catch (err) {
            showStatus(err.message, true);
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            name: nameField.value.trim(),
            department: departmentField.value.trim(),
            salary: parseFloat(salaryField.value)
        };

        const id = idField.value;
        const isEdit = !!id;
        const url = isEdit ? `${API_BASE}/${id}` : `${API_BASE}/`;
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const body = await res.json();
            if (!res.ok) {
                throw new Error(body.message || 'Request failed');
            }
            showStatus(body.message, false);
            resetForm();
            loadEmployees();
        } catch (err) {
            showStatus(err.message, true);
        }
    });

    cancelEditBtn.addEventListener('click', resetForm);
    refreshBtn.addEventListener('click', loadEmployees);

    loadEmployees();
</script>
</body>
</html>
