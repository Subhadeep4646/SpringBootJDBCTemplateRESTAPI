<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* Custom styles for tables and form */
        .container {
            margin-top: 20px;
        }
        .card-custom {
            margin-bottom: 20px;
        }
        .action-buttons button {
            margin-right: 5px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1 class="text-center mb-4">Employee Management</h1>

    <!-- Add Employee Form -->
    <div class="card card-custom">
        <div class="card-header">
            <h5>Add a New Employee</h5>
        </div>
        <div class="card-body">
            <form id="addEmployeeForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="department" class="form-label">Department</label>
                    <input type="text" class="form-control" id="department" required>
                </div>
                <div class="mb-3">
                    <label for="salary" class="form-label">Salary</label>
                    <input type="number" class="form-control" id="salary" required>
                </div>
                <button type="submit" class="btn btn-primary" id="submitButton">Add Employee</button>
            </form>
        </div>
    </div>

    <!-- Employee List Table -->
    <div class="card card-custom">
        <div class="card-header">
            <h5>Employee List</h5>
        </div>
        <div class="card-body">
            <table class="table table-bordered" id="employeeTable">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="employeeTableBody">
                <!-- Employee rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const apiUrl = 'http://localhost:8082/api/v1/employee/';
    let editingEmployeeId = null;

    // Function to fetch and display employees
    function fetchEmployees() {
        fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                const tableBody = document.getElementById('employeeTableBody');
                tableBody.innerHTML = '';

                // Normalize API response to an array
                const employees = Array.isArray(data)
                    ? data
                    : Array.isArray(data?.content)
                        ? data.content
                        : Array.isArray(data?.data)
                            ? data.data
                            : Array.isArray(data?.employees)
                                ? data.employees
                                : [];

                if (!Array.isArray(data)) {
                    console.warn('Unexpected employee payload shape:', data);
                }

                employees.forEach(employee => {
                    const row = document.createElement('tr');

                    const idCell = document.createElement('td');
                    idCell.textContent = employee.id;
                    row.appendChild(idCell);

                    const nameCell = document.createElement('td');
                    nameCell.textContent = employee.name;
                    row.appendChild(nameCell);

                    const departmentCell = document.createElement('td');
                    departmentCell.textContent = employee.department;
                    row.appendChild(departmentCell);

                    const salaryCell = document.createElement('td');
                    salaryCell.textContent = employee.salary;
                    row.appendChild(salaryCell);

                    const actionsCell = document.createElement('td');
                    actionsCell.className = 'action-buttons';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'btn btn-warning btn-sm';
                    editBtn.textContent = 'Edit';
                    editBtn.addEventListener('click', () => {
                        editEmployee(employee.id, employee.name, employee.department, employee.salary);
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn btn-danger btn-sm';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.addEventListener('click', () => {
                        deleteEmployee(employee.id);
                    });

                    actionsCell.appendChild(editBtn);
                    actionsCell.appendChild(deleteBtn);
                    row.appendChild(actionsCell);

                    tableBody.appendChild(row);
                });
            })
            .catch(error => console.error('Error fetching employees:', error));
    }

    // Function to add or update an employee
    document.getElementById('addEmployeeForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const department = document.getElementById('department').value.trim();
        const salary = Number(document.getElementById('salary').value);

        const employeePayload = {
            name,
            department,
            salary
        };

        const method = editingEmployeeId ? 'PUT' : 'POST';
        const url = editingEmployeeId ? `${apiUrl}${editingEmployeeId}` : apiUrl;

        fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(employeePayload)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json().catch(() => ({}));
            })
            .then(() => {
                alert(editingEmployeeId ? 'Employee updated successfully' : 'Employee added successfully');
                fetchEmployees();
                document.getElementById('addEmployeeForm').reset();
                editingEmployeeId = null;
                document.getElementById('submitButton').textContent = 'Add Employee';
            })
            .catch(error => console.error('Error adding/updating employee:', error));
    });

    // Function to edit an employee
    function editEmployee(id, name, department, salary) {
        editingEmployeeId = id;
        document.getElementById('name').value = name;
        document.getElementById('department').value = department;
        document.getElementById('salary').value = salary;
        document.getElementById('submitButton').textContent = 'Update Employee';
    }

    // Function to delete an employee
    function deleteEmployee(id) {
        if (confirm('Are you sure you want to delete this employee?')) {
            fetch(`${apiUrl}${id}`, {
                method: 'DELETE'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    alert('Employee deleted successfully');
                    fetchEmployees();
                })
                .catch(error => console.error('Error deleting employee:', error));
        }
    }

    // Initial fetch to load employees
    fetchEmployees();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
